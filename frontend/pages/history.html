<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat History — CareerCompass AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .history-item { display: flex; justify-content: space-between; align-items: flex-start; padding: var(--space-4) 0; border-bottom: 1px solid var(--color-border); }
    .history-item:last-child { border-bottom: none; }
    .history-question { font-weight: 500; margin-bottom: var(--space-1); }
    .history-time { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-slate); white-space: nowrap; margin-left: var(--space-4); }
  </style>
</head>
<body data-page="history">

  <div class="app-shell">
    <div id="sidebar-slot"></div>

    <main class="app-main">
      <div class="page-header">
        <h1>Chat History</h1>
        <p>Every conversation is saved so your guidance builds over time.</p>
      </div>

      <div id="history-status" class="status-message" hidden style="max-width: 760px;"></div>
      <div id="history-list" class="card" style="max-width: 760px;"></div>
    </main>
  </div>

  <script src="../js/load-partials.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui-helpers.js"></script>
  <script src="../js/history.js"></script>
</body>
</html>
