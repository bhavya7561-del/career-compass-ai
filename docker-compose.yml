version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-compass-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend       # live code reload during development
      - ./database:/app/database     # SQLite file persists on host
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: career-compass-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
